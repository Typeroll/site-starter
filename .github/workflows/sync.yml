name: Synchronize released starter
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: synchronize-starter
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'Typeroll/site-starter' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
      - name: Generate from a verified public MCP release
        run: node .github/template/sync.mjs
      - name: Validate generated files and copy guards
        run: node --test .github/template/sync.test.mjs
      - name: Publish template changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add AGENTS.md README.md brief workflows decisions.md sources scripts qa pages typeroll.json typeroll.lock.json .gitignore .github/starter-source.json
          if git diff --cached --quiet; then exit 0; fi
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('.github/starter-source.json','utf8')).version")
          git config user.name autopilot
          git config user.email 60662805+bootingbots@users.noreply.github.com
          git commit -m "Sync starter from MCP $VERSION"
          gh auth setup-git
          git push origin "$(git rev-parse HEAD):refs/heads/main"
